name: Build Incus novm image

on:
  push:
    branches: ["main"]
    tags: ["incus-v*"]
  workflow_dispatch:

concurrency:
  group: build-incus-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build-novm (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and validate runtime tools
        run: |
          docker buildx build --load \
            --platform ${{ matrix.platform }} \
            --build-arg INCUS_REVISION=${{ github.sha }} \
            --tag incus-novm-test:${{ matrix.arch }} \
            --file deploy/image/Dockerfile .
          docker run --rm --entrypoint sh incus-novm-test:${{ matrix.arch }} -ec '
            incusd --version | grep -Eq "^7[.][0-9]+([.][0-9]+)?$"
            incus --version | grep -Eq "^7[.][0-9]+([.][0-9]+)?$"
            criu --version
            command -v cgcreate
            command -v cgexec
            command -v nsenter
            command -v rbd
            command -v lvm
            command -v udevadm
            command -v zfs
            command -v zpool
            command -v iptables-restore
            command -v ip6tables-restore
            command -v iptables-legacy-restore
            command -v ip6tables-legacy-restore
            command -v lxcfs
            test -x /usr/local/sbin/incus-start.sh
            test -x /usr/local/sbin/lxcfs-start.sh
            test -x /usr/local/sbin/healthcheck.sh
            sh -n /usr/local/sbin/incus-start.sh
            sh -n /usr/local/sbin/lxcfs-start.sh
            sh -n /usr/local/sbin/healthcheck.sh
            ! grep -Eq "^[[:space:]]*lxcfs .*&" /usr/local/sbin/incus-start.sh
            tar --help 2>&1 | grep -q -- "--no-unquote"
            ! ldd /usr/sbin/incusd | grep -q "not found"
            ! ldd /usr/local/sbin/criu | grep -q "not found"
            ! ldd /usr/lib/liblxc.so.1.9.0 | grep -q "not found"
            strings /usr/lib/liblxc.so.1.9.0 | grep -q "apparmor"
            grep -qx "INCUS_REVISION=${{ github.sha }}" /usr/share/incus-runtime/components.env
            grep -Eq "^LXC_REF=[0-9a-f]{40}$" /usr/share/incus-runtime/components.env
            grep -Eq "^LXC_COMMIT=[0-9a-f]{40}$" /usr/share/incus-runtime/components.env
            test "$(sed -n 's/^LXC_REF=//p' /usr/share/incus-runtime/components.env)" = \
              "$(sed -n 's/^LXC_COMMIT=//p' /usr/share/incus-runtime/components.env)"
            grep -Eq "^LXCFS_PACKAGE=lxcfs-.+$" /usr/share/incus-runtime/components.env
            grep -Eq "^CRIU_COMMIT=[0-9a-f]{40}$" /usr/share/incus-runtime/components.env
            grep -Eq "^ALPINE_IMAGE=alpine:[^@]+@sha256:[0-9a-f]{64}$" /usr/share/incus-runtime/components.env
            grep -Eq "^APK_PACKAGES_SHA256=[0-9a-f]{64}$" /usr/share/incus-runtime/components.env
          '
          test "$(docker image inspect \
            --format "{{.Config.StopSignal}}" \
            incus-novm-test:${{ matrix.arch }})" = "SIGTERM"

      - name: Build and push image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: deploy/image/Dockerfile
          push: true
          build-args: |
            INCUS_REVISION=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:novm-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.github.fivetime.incus.variant=novm
          platforms: ${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  publish:
    name: publish-novm manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tags=(
            --tag "${IMAGE}:novm"
            --tag "${IMAGE}:novm-${short_sha}"
          )
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tags+=(--tag "${IMAGE}:novm-${GITHUB_REF_NAME}")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "${IMAGE}:novm-${GITHUB_SHA}-amd64" \
            "${IMAGE}:novm-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE}:novm"
